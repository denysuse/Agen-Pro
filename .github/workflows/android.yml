name: Fullstack CI - Fixed Gradle 8.4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 ONLY
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Force Gradle 8.4 wrapper
        run: |
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          # Generate wrapper JAR dengan Gradle 8.4 (bukan 9.7)
          gradle wrapper --gradle-version 8.4 --no-daemon
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Backend
        run: ./gradlew :backend:build --stacktrace --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-funnel-apk
          path: app/build/outputs/apk/debug/*.apk
