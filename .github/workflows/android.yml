name: Fullstack CI - Auto Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix gradlew permission
        run: chmod +x ./gradlew
      
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Show project structure
        run: |
          echo "ROOT:"
          ls -la
          echo ""
          echo "settings.gradle.kts:"
          cat settings.gradle.kts || cat settings.gradle || echo "not found"
          echo ""
          echo "Gradle projects:"
          ./gradlew projects || true

      - name: Build Backend (if exists)
        continue-on-error: true
        run: |
          if grep -q "backend" settings.gradle.kts 2>/dev/null || [ -d "backend" ]; then
            ./gradlew :backend:build --stacktrace
          else
            echo "No backend module found, skipping"
          fi

      - name: Build Android APK (if app exists)
        continue-on-error: false
        run: |
          if [ -d "app" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "No app folder! Trying root assembleDebug"
            ./gradlew assembleDebug --stacktrace || ./gradlew build --stacktrace
          fi

      - name: Find all APKs and JARs
        if: always()
        run: |
          echo "=== SEARCHING APK ==="
          find . -type f -name "*.apk" | tee apk-list.txt || echo "No APK found"
          echo ""
          echo "=== BUILD FOLDERS ==="
          find . -type d -name "outputs" | head -20
          ls -la app/build/outputs/apk/debug/ 2>&1 || true
          ls -la build/outputs/apk/debug/ 2>&1 || true
          ls -la backend/build/libs/ 2>&1 || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-funnel-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
            app/build/outputs/**/*.apk
          if-no-files-found: warn

      - name: Upload Backend JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: |
            backend/build/libs/*.jar
            **/build/libs/*.jar
          if-no-files-found: warn
